# GigBid configuration. Rules, budgets and model choices live here, never in code,
# so a platform policy change is a config edit (see the change request in the brief).

marketplace:
  mode: gigsim                     # overridden by MARKETPLACE_MODE
  gigsim:
    base_url: http://localhost:8100
  upwork_live:
    url: https://mcp.upwork.com/mcp
    # Reads at most every 15 min per identical query: a person checking the feed, not a scraper.
    min_read_interval_s: 900
    # Port method -> Upwork MCP tool name. Verified against list_tools() on connect;
    # update here if Upwork renames a tool. Empty means "not supported in live mode".
    tool_map:
      search_jobs: search_jobs
      get_job: get_job_details
      get_client_history: get_client_info
      get_connects_balance: get_connects_balance
      list_threads: list_rooms
      get_thread: get_room_messages
      create_proposal_draft: create_proposal_draft
      submit_proposal: submit_proposal
      send_message: send_message

marketplace_server:
  # Stay under GigSim's 20 requests / 10 s with headroom for retries.
  rate_limit: {requests: 15, per_seconds: 10, max_wait_s: 20}
  audit_log: data/audit/marketplace.jsonl

# ---------------------------------------------------------------------------
# Models: routed per node. `open` is the required profile (open-weight models on Groq);
# `paid` is the comparison profile. Select with GIGBID_MODEL_PROFILE or `models.profile`.
# A node missing from a profile falls back to that profile's `default`. With no API key
# the node runs its deterministic rule path instead (CI, offline demos).
# ---------------------------------------------------------------------------
models:
  profile: open
  profiles:
    open:
      provider: groq
      default: llama-3.3-70b-versatile
      nodes:
        analyst: llama-3.1-8b-instant          # extraction: small and fast is enough
        risk: llama-3.3-70b-versatile
        writer: llama-3.3-70b-versatile
        critic: openai/gpt-oss-120b            # judge from a different family than the writer
        compliance: llama-3.1-8b-instant
        liaison: llama-3.3-70b-versatile
    # Same open-weight family served locally by the compose `ollama` service (no API key, no data
    # leaves the machine). Pull the models once: `docker compose exec ollama ollama pull qwen2.5:7b`.
    open_local:
      provider: ollama
      default: qwen2.5:7b
      nodes:
        analyst: llama3.2:3b
        compliance: llama3.2:3b
    paid:
      provider: anthropic
      default: claude-sonnet-5-5
      nodes:
        analyst: claude-haiku-5-5
        compliance: claude-haiku-5-5
  # Cheap nodes fall back to this model when their own model errors or times out (C7).
  fallback: {model: llama-3.1-8b-instant, nodes: [analyst, risk, compliance, critic]}
  temperature: {default: 0.2, writer: 0.6}
  timeout_s: 45
  max_retries: 2
  # USD per 1M tokens (input, output) for cost reporting in evals/results.
  prices:
    llama-3.1-8b-instant: [0.05, 0.08]
    llama-3.3-70b-versatile: [0.59, 0.79]
    openai/gpt-oss-120b: [0.15, 0.75]
    claude-haiku-5-5: [1.0, 5.0]
    claude-sonnet-5-5: [3.0, 15.0]

# Per-run budgets (R8). Exceeding one halts the run with status budget_exceeded.
budgets:
  bid:  {max_steps: 30, max_tokens: 60000, max_usd: 0.10}
  conversation: {max_steps: 15, max_tokens: 20000, max_usd: 0.03}

bid_graph:
  critic_max_loops: 2              # writer is revised at most twice
  timeouts_s: {default: 60, writer: 120, critic: 90}   # per node (C7)
  retries: {default: 2, submit: 3}                    # transient failures only; then dead_letter
  critic_pass_score: 0.7
  evidence_per_requirement: 3
  decision:
    min_coverage: 0.5              # share of requirements with real evidence
    max_scam_score: 0.5
    min_connects_reserve: 4        # never spend the last few Connects
    # "watch" instead of skip when a job is close: shown in the inbox, nothing is drafted yet.
    watch_min_coverage: 0.35
    watch_max_scam_score: 0.65
  pricing:
    target_percentile: p50         # start from the market median ...
    stay_inside_budget: true       # ... clamped into the client's posted range
    floor_policy: skip_below       # budget max under the persona floor -> skip

# MCP servers the graph connects to and which tools each agent may call (least privilege).
mcp:
  servers:
    marketplace: {transport: stdio, command: python, args: ["-m", "mcp_servers.marketplace.server", "--stdio"]}
    portfolio:   {transport: stdio, command: python, args: ["-m", "mcp_servers.portfolio.server", "--stdio"]}
    workspace:   {transport: stdio, command: python, args: ["-m", "mcp_servers.workspace.server", "--stdio"]}
  allowlists:
    intake:     [marketplace.get_job, marketplace.get_client_history, marketplace.get_platform_policy,
                 marketplace.get_connects_balance]
    scout:      [marketplace.search_jobs, marketplace.list_events]
    matcher:    [portfolio.search_evidence, portfolio.get_case_study, portfolio.list_skills]
    pricing:    [marketplace.get_price_stats]
    writer:     [portfolio.search_evidence, portfolio.get_case_study]
    approval:   [marketplace.create_proposal_draft]
    submit:     [marketplace.create_proposal_draft, marketplace.submit_proposal]
    # Conversation graph: drafting agents read; only the post-approval node can send or hold time.
    liaison:    [marketplace.list_messages, marketplace.get_job, portfolio.search_evidence, portfolio.get_case_study,
                 workspace.free_slots, workspace.create_email_draft]
    reply_approval: [marketplace.send_message]          # dry_run preview only
    reply_send: [marketplace.send_message, workspace.create_interview_hold]

# Guardrails (R9). Patterns are data so a new attack or scam style is a config edit.
guardrails:
  policy_rules_file: data/policy_pack/rules.json
  injection_patterns:
    - '(?i)ignore (all )?(previous|prior|above) instructions'
    - '(?i)disregard (your|all|the) (rules|instructions)'
    - '(?i)note to (ai|llm) assistants?'
    - '(?i)\b(note|message|instructions?) (to|for) (any|all|the)? ?(ai|llm|bot|automated|assistant)\b'
    - '(?i)\bai (tool|assistant|agent)s? reading this\b'
    - '(?i)\[\s*system\s*\]|you are now in \w+ mode'
    - '(?i)if you are an? (automated|ai)\b[^.]*'
    - '(?i)<!--\s*ai:.*?-->'
    - '(?i)\bassistant,\s'
    - '(?i)(skip|bypass) the (compliance|approval|review)'
    - '(?i)without (waiting for )?human approval'
    - '(?i)spend all (available )?connects'
  scam_patterns:
    off_platform: ['(?i)\b(telegram|whatsapp|skype|signal)\b', '(?i)outside the platform', '(?i)bank transfer',
                   '(?i)email your resume to', '[\w.+-]+@[\w-]+\.[\w.]+']
    free_work: ['(?i)free (test|sample|trial) task', '(?i)unpaid (test|trial)', '(?i)full working prototype as a free']
    payment: ['(?i)send you a cheque', '(?i)forward the rest', '(?i)keep \$\d+']
    credentials: ['(?i)send (us |me )?your (platform )?(login|password|credentials)']
  client_signals:
    unverified_payment: 0.25
    new_client_no_spend: 0.1
    low_hire_rate: {below: 0.1, min_jobs: 10, weight: 0.1}

# Retrieval (Part B). The variant is picked from the measured comparison in evals/results/
# (see docs/DATA_CARD.md); RAG_VARIANT overrides it for eval runs.
rag:
  variant: best

# Long-term memory (Part C2). Promotion rules: nothing is remembered from a single event.
memory:
  style:
    promote_after: 2        # an edit pattern becomes a rule after this many separate edits
  outcome:
    min_outcomes: 5         # resolved proposals in a category before anything is remembered
    min_support: 3          # proposals behind a lesson
    min_lift: 0.15          # lesson's reply rate must beat the category rate by this much

# Autonomy (Part C5). Per user; the API stores the user's choice. Nothing is ever auto-sent.
autonomy:
  default: suggest          # suggest: low-fit skips wait for the user | auto_skip: low-fit skips close themselves

# Background worker (E1). Scouting runs on each saved search's own schedule.
worker:
  default_interval_min: 60     # searches made from the user's categories when none are saved
  min_interval_min: 15         # never scout one search more often than this (GigSim)
  max_new_jobs_per_scout: 5
  sync_every_s: 15             # marketplace events -> pipeline, memory and reply drafts

# Declared service levels (E5). Measured values live in evals/results/ (decisions.json p95_ms per job
# analysed; outcomes.json p95_s and usd_per_proposal per proposal) and are reported against these.
slo:
  job_analysed: {p95_s: 8.0, usd: 0.004}     # intake -> decide -> price, with model calls (open profile)
  proposal: {p95_s: 30.0, usd: 0.02}         # through writer, verify, critic loop, compliance, to approval
  optimisations:                              # what keeps us inside the budget, in order of impact
    - skip early: risk and fit run before any drafting, so skipped jobs never reach the writer or critic
    - small models for routing and risk: analyst and compliance on llama-3.1-8b-instant
    - evidence caching: embeddings and reranker scores cached on disk by text hash
