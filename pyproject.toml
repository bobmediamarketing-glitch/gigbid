[project]
name = "gigbid"
version = "0.1.0"
description = "Multi-agent freelancer copilot (AI-4016 R&D assignment)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.163.1",
  "mcp[cli]==1.30.0",
  "rank-bm25==0.2.2",
  "pypdf==7.1.0",
  "tzdata==2026.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.14.3",
  "httpx==0.28.1",
  "pyyaml==6.0.3",
  "reportlab==4.5.1",
  "langgraph==1.2.22",
  "langgraph-checkpoint-postgres==3.2.1",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langchain-core==1.8.0",
  "langchain-groq==1.1.3",
  "langchain-mcp-adapters==0.3.2",
  "psycopg[binary]==3.3.9",
  "fastembed==0.9.1",
  "sqlalchemy==2.1.8",
  "cryptography==50.0.2",
  "email-validator==2.4.0",
  "sse-starlette==3.7.0",
  "python-multipart==0.0.33",
  "pyjwt==2.15.1",
  "numpy==2.5.4",
  "arq==0.28.0",
  "redis==5.3.1",
  "langfuse==5.2.0",
  "qdrant-client==1.20.0",
  "langchain-ollama==1.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "anyio==4.16.0", "fakeredis==2.40.0", "ruff==0.17.5", "pgserver==0.1.4"]
paid = ["langchain-anthropic"]  # only for the comparison "paid" model profile

[tool.pytest.ini_options]
testpaths = ["tests", "mcp_servers"]

[tool.uv]
package = false   # an application, not a library: uv only manages the environment

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["gigsim", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "I001"]
